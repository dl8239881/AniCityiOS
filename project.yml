name: AniCity
options:
  bundleIdPrefix: com.anicity
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: NO
    CLANG_ENABLE_MODULES: YES
    VALIDATE_PRODUCT: NO

configs:
  Debug: debug
  Release: release

targets:
  AniCity:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: AniCity/Sources
      - path: AniCity/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: AniCity
        PRODUCT_BUNDLE_IDENTIFIER: com.anicity.laceandmayhem
        INFOPLIST_FILE: AniCity/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SDKROOT: iphoneos
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        VALIDATE_PRODUCT: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
          SWIFT_COMPILATION_MODE: wholemodule
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone

schemes:
  AniCity:
    build:
      targets:
        AniCity: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
